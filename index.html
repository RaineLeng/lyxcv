                    {/* Center Point */}
                    <div className="w-[20%] flex justify-center relative">
                        <div className={`w-3 h-3 bg-bg border-2 ${isVisible ? 'border-accent scale-125' : 'border-gray-700'} rounded-full transition-all duration-500 z-10 group-hover:scale-150 group-hover:bg-accent`}></div>
                        <div className="absolute top-1/2 -translate-y-1/2 text-[10px] font-mono text-gray-600 w-32 text-center group-hover:text-white transition-colors">
                            {item.year}
                        </div>
                    </div>

                    {/* Empty Space for Balance */}
                    <div className="w-[40%]"></div>
                </div>
            );
        };

        const Timeline = ({ onSelect }) => {
            const [visibleItems, setVisibleItems] = useState({});
            const containerRef = useRef(null);
            const lineRef = useRef(null);

            useEffect(() => {
                const handleScroll = () => {
                    if (!containerRef.current || !lineRef.current) return;
                    
                    const rect = containerRef.current.getBoundingClientRect();
                    const windowHeight = window.innerHeight;
                    
                    const start = rect.top;
                    const end = rect.bottom;
                    const totalHeight = rect.height;
                    
                    const offset = windowHeight / 2;
                    let progress = (windowHeight / 2 - start) / totalHeight;
                    progress = Math.max(0, Math.min(1, progress));
                    
                    lineRef.current.style.height = `${progress * 100}%`;

                    resumeData.experience.forEach((_, index) => {
                        const el = document.getElementById(`timeline-item-${index}`);
                        if (el) {
                            const itemRect = el.getBoundingClientRect();
                            if (itemRect.top < windowHeight * 0.7) {
                                setVisibleItems(prev => ({...prev, [index]: true}));
                            }
                        }
                    });
                };

                window.addEventListener('scroll', handleScroll);
                handleScroll(); 
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="py-4 relative max-w-5xl mx-auto px-4" ref={containerRef}>
                    <div className="absolute left-1/2 top-0 bottom-0 w-[1px] bg-gray-900 -translate-x-1/2"></div>
                    <div 
                        ref={lineRef} 
                        className="absolute left-1/2 top-0 w-[2px] bg-accent -translate-x-1/2 transition-all duration-100 ease-linear shadow-[0_0_10px_#FF4B4B]"
                        style={{height: '0%'}}
                    ></div>

                    {resumeData.experience.map((item, index) => (
                        <div id={`timeline-item-${index}`} key={index}>
                            <TimelineItem 
                                item={item} 
                                index={index} 
                                isVisible={visibleItems[index]} 
                                onClick={onSelect}
                            />
                        </div>
                    ))}
                </div>
            );
        };

        const Skills = () => {
            const gridRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        anime({
                            targets: gridRef.current.children,
                            scale: [0, 1],
                            opacity: [0, 1],
                            delay: anime.stagger(100, {grid: [4, 3], from: 'center'}),
                            easing: 'spring(1, 80, 10, 0)'
                        });
                        observer.disconnect();
                    }
                }, { threshold: 0.5 });
                
                if (gridRef.current) observer.observe(gridRef.current);
            }, []);

            return (
                <div className="py-32 flex flex-col items-center">
                    <h2 className="text-3xl font-light mb-16 tracking-widest text-gray-500">技能栈</h2>
                    <div ref={gridRef} className="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-12">
                        {resumeData.skills.map((skill, i) => (
                            <div key={i} className="flex flex-col items-center group cursor-default">
                                <div className="w-14 h-14 border border-gray-800 rounded-full flex items-center justify-center mb-4 group-hover:border-accent group-hover:bg-accent/10 transition-colors duration-300 relative overflow-hidden">
                                    <div className="absolute inset-0 bg-accent opacity-0 group-hover:opacity-10 transition-opacity"></div>
                                    <div className="w-1.5 h-1.5 bg-gray-600 rounded-full group-hover:bg-accent transition-colors group-hover:scale-150"></div>
                                </div>
                                <span className="text-sm text-gray-400 group-hover:text-white transition-colors text-center">
                                    {skill}
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Footer = () => (
            <footer className="py-12 text-center border-t border-gray-900 text-gray-600 text-xs font-mono">
                <p>DESIGNED & CODED WITH ANIME.JS</p>
                <p className="mt-2">© 2026 冷语欣</p>
            </footer>
        );

        const App = () => {
            const [selectedExp, setSelectedExp] = useState(null);

            return (
                <div className="min-h-screen bg-bg selection:bg-accent selection:text-white">
                    <Hero />
                    <Timeline onSelect={setSelectedExp} />
                    <Skills />
                    <Footer />
                    
                    <Modal 
                        isOpen={!!selectedExp} 
                        onClose={() => setSelectedExp(null)} 
                        data={selectedExp} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
